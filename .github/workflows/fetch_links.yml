name: Pro VPN Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 1. Fetch Telegram Link
        run: python fetch_telegram.py

      - name: 2. Decode Happ Code
        run: python decoder.py

      - name: 3. Process, Ping & Save Nodes
        run: python processor.py

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Modular pipeline execution: fetch, decode, ping & save"
          file_pattern: 'Toplanan_linkler.txt'
