name: 7/24 KODLARY Updater

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # Her saat başı

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Collector
        run: python collector.py
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik KODLARY Guncellemesi"
          file_pattern: KODLARY
