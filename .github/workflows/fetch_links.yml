name: Pro VPN Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone Decryptor Repo
        uses: actions/checkout@v4
        with:
          repository: 'LeeeeT/happ-decryptor'
          path: 'happ-decryptor'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Local Decryption Collector
        run: python collector.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Toplanan_linkler.txt
          git commit -m "Auto-update VPN nodes via local happ-decryptor [skip ci]" || exit 0
          git push
