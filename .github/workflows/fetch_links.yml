name: Pro VPN Node Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download Decryptor Cleanly
        run: |
          rm -rf happ-decryptor
          npx degit LeeeeT/happ-decryptor happ-decryptor

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Local Decryption Collector
        run: |
          cd happ-decryptor
          npm install
          npm run build &
          sleep 5
          cd ..
          python collector.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Toplanan_linkler.txt
          git commit -m "Auto-update VPN nodes via local happ-decryptor [skip ci]" || exit 0
          git push
