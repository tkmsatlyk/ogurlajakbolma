name: Telegram Config Updater

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: telegram-config-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: npm paketlerini kur
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "package.json yok, npm kurulumu atlandı."
          fi

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: hpwnr kur
        run: |
          cargo install hpwnr --locked
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          hpwnr --help

      - name: Telegram kanallarını tara
        run: |
          python scripts/update.py

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Toplanan_linkler.txt

          if git diff --cached --quiet; then
            echo "Yeni değişiklik yok."
            exit 0
          fi

          git commit -m "Update Telegram configs"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

          echo "Yeni sonuç GitHub'a gönderildi."
