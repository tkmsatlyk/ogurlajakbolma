name: vpn-test

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-dosya
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Xray kur
        run: |
          curl -sL -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          sudo unzip -q -o xray.zip xray -d /usr/local/bin
          xray version
      - name: Test et
        working-directory: vpn_sistem
        run: python -c "import link_checker; link_checker.run_once()"
      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vpn_sistem/toplanan_linkler.txt
          git diff --cached --quiet || (git commit -m "Testten gecenler" && git pull --rebase --autostash && git push)
