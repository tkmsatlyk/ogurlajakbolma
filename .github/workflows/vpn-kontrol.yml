name: vpn-topla

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vpn-dosya
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Topla
        working-directory: vpn_sistem
        run: python -c "import collector; collector.collect()"
      - name: Kaydet
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vpn_sistem/toplanan_linkler.txt
          git diff --cached --quiet || (git commit -m "Linkler toplandi" && git pull --rebase --autostash && git push)
