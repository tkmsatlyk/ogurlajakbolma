name: Otomatik Happ Link Toplayıcı

on:
  schedule:
    - cron: '0 * * * *' # Her saat başı çalışır
  workflow_dispatch: # Elle tetiklemek için

permissions:
  contents: write  # <-- Hatanın çözümü burası! Git push yetkisi verir.

jobs:
  update-links:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scripti Çalıştır
        run: python update.py

      - name: Değişiklikleri Kaydet ve GitHub'a Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.name"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Otomatik güncellendi [Skip CI]" && git push)
