name: Sub Dosyalarini Guncelle

on:
  push:
    paths:
      - 'KODLARY'
      - 'CONFIG'
  schedule:
    # Süresi dolanları otomatik silmesi için her gün gece yarısı (UTC) çalışır
    - cron: '0 0 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Python Scriptini Calistir
        run: python update.py
        
      - name: Degisiklikleri Kaydet ve Pushla
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.node.red.github.com"
          git pull origin main --rebase || true
          git add .
          git commit -m "${COMMIT_MSG:-Otomatik guncelleme [skip ci]}" || echo "Degisiklik yok"
          git push
